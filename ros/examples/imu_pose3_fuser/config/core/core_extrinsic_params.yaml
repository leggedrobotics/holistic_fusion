#External Prior/Transform Input
extrinsics:
  # Published by GMSF
  worldFrame: "world_holistic_fusion"
  odomFrame: "odom_holistic_fusion"
  # Used for estimation
  imuFrame: "imu_link"       # IMU_CABIN_link           #Frame of IMU used in integrator - Used for lookup transform to lidarFrame
  baseLinkFrame: "imu_link"
  initializeZeroYawAndPositionOfFrame: "imu_link"

name_ids:
  fixedFrameAligned: "_holistic_fusion_aligned"  # Specifies what is the suffix of the aligned published fixed frames
  sensorFrameCorrected: "_holistic_fusion_corrected" # Specifies what is the suffix of the corrected published sensor frames
